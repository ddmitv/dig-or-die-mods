name: Publish AssetPacker to NuGet

on:
  push:
    branches:
      - main
    paths:
      - "plugins/dodmodapi/AssetPacker/AssetPacker.csproj"
      - ".github/workflows/publish-assetpacker.yml"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore plugins/dodmodapi/AssetPacker/AssetPacker.csproj

      - name: Pack AssetPacker
        run: dotnet pack plugins/dodmodapi/AssetPacker/AssetPacker.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "plugins/dodmodapi/AssetPacker/bin/Release/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate