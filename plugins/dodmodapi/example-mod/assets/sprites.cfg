# Define 128x128 tiles (blocks/items)
TILE exampleWall example_wall.png
TILE exampleDevice tile=example_device.png icon=example_device_icon.png

# Define arbitrary sprites (e.g., for bullets or effects)
SPRITE exampleBullet example_bullet.png

# Define a custom surface (icon + material + top border)
TILE exampleSurface icon=example_surface.png
SURFACE exampleSurface material=example_surface_mat.png top=example_surface_top.png

UNIT exampleUnit stand=example_unit_stand1.png run=example_unit_run1.png+example_unit_run2.png